<div class="row">
    <table><!-- Table des concerts ici--></table>
    <form action="/concerts" method="POST">
        <h2>Ajouter un concert</h2>
        <label for="tour">Tournée</label>
        <div>
        <select id="tour" name="tour">
            <option value="101">Marvel Studios Infinity Saga Tour</option>
        </select>
        <span class="fieldError">Message d'erreur</span>
        </div>

        <label for="venue">Salle</label>
        <div>
        <select id="venue" name="venue">
            <option value="1">Stade Roi Baudoin</option>
        </select>
        <span class="fieldError">Message d'erreur</span>
        </div>

        <label for="time">Date et heure</label>
        <div>
            <input type="datetime-local" name="time" id="time" value="">
            <span class="fieldError">Message d'erreur</span>
        </div>
        
        <button class="btn center">Ajouter</button>
    </form>
</div>
